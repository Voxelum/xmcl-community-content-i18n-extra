name: Build DB

# Builds one read-only `<locale>.db` per locale (Node 24 built-in zstd + a raw
# content dictionary) and publishes them to the rolling `db-latest` release so
# clients get stable download URLs. Node is used to match the Electron runtime
# that reads these files (the zstd `dictionary` option needs Node >= 24).

on:
  workflow_dispatch:
  # Rebuild after a successful translation sync.
  workflow_run:
    workflows: ["Sync translations", "Translate pending content"]
    types: [completed]

concurrency:
  group: build-db
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build databases
        run: node scripts/build_db.mjs

      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create db-latest \
            --title "Prebuilt translation databases" \
            --notes "One \`<locale>.db\` per locale (queryable) plus \`<locale>.db.br\` (brotli, for download)." \
            || true
          gh release upload db-latest dist/*.db dist/*.db.br --clobber
